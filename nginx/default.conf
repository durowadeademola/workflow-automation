# Laravel
server {
    listen 80;
    server_name blueflowautomation.com www.blueflowautomation.com;

    root /var/www/html/public;  # Laravel container's path
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel_app:9000;  # points to the Laravel container
        fastcgi_index index.php;
        include fastcgi_params;
    }
}

# n8n
server {
    listen 80;
    server_name n8n.blueflowautomation.com;

    location / {
        proxy_pass http://n8n_n8n_1:5678;  # points to n8n container
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}