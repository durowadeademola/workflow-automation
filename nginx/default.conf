# -------------------------
# HTTP → HTTPS REDIRECT
# -------------------------

server {
    listen 80;
    server_name blueflowautomation.com www.blueflowautomation.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name n8n.blueflowautomation.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------
# HTTPS Laravel
# -------------------------

server {
    listen 443 ssl;
    server_name blueflowautomation.com www.blueflowautomation.com;

    ssl_certificate /etc/letsencrypt/live/blueflowautomation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blueflowautomation.com/privkey.pem;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# -------------------------
# HTTPS n8n
# -------------------------

server {
    listen 443 ssl;
    server_name n8n.blueflowautomation.com;

    ssl_certificate /etc/letsencrypt/live/blueflowautomation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blueflowautomation.com/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}